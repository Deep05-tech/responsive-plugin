<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixture 01 - Fixed Width Containers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .elementor { width: 100%; }
    .elementor-section { position: relative; width: 100%; }
    .elementor-container { display: flex; margin-right: auto; margin-left: auto; position: relative; }
    .elementor-column { min-height: 1px; position: relative; display: flex; }
    .elementor-widget-wrap { position: relative; width: 100%; display: flex; flex-wrap: wrap; align-content: flex-start; }
    .elementor-element { position: relative; }

    /* Planted Bug: Fixed width element that exceeds mobile viewport */
    #sec-fixed-hero .elementor-container { width: 100%; max-width: 850px; }
    #w-fixed-box-container { width: 600px; max-width: none; }
    #sec-fixed-promo { width: 750px; max-width: none; margin: 20px auto; background: #f1f2f6; padding: 20px; }
  </style>
</head>
<body>
  <div class="elementor elementor-101">
    <section class="elementor-section elementor-element" data-id="sec-fixed-hero" id="sec-fixed-hero">
      <div class="elementor-container">
        <div class="elementor-column elementor-element" data-id="col-fixed-main" style="width: 100%;">
          <div class="elementor-widget-wrap">
            <div class="elementor-element elementor-widget elementor-widget-heading" data-id="w-heading-title" style="width: 100%;">
              <div class="elementor-widget-container">
                <h1 style="font-size: 28px; padding: 16px 0;">Welcome to Fixed Width Container Test</h1>
              </div>
            </div>
            <div class="elementor-element elementor-widget elementor-widget-html" data-id="w-fixed-box-container" id="w-fixed-box-container">
              <div class="elementor-widget-container">
                <div style="width: 600px; background: #3498db; color: #fff; padding: 20px; border-radius: 8px;">
                  Fixed 600px width card that overflows viewport on mobile (375px)
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="elementor-element elementor-element-populate elementor-widget-wrap" data-id="sec-fixed-promo" id="sec-fixed-promo">
      <div class="elementor-element elementor-widget elementor-widget-text-editor" data-id="w-fixed-promo-card">
        <div class="elementor-widget-container">
          <p style="font-size: 16px; color: #333;">This is a fixed container set to 750px wide.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
