<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixture 00 - Clean Responsive Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
    }
    .elementor { width: 100%; }
    .elementor-element { position: relative; }

    #sec-clean-hero {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding: 32px 20px;
      gap: 20px;
    }
    h1 {
      font-size: 28px;
      color: #0f172a;
      line-height: 1.3;
    }
    p {
      font-size: 16px;
      color: #475569;
    }
    .btn-clean {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 140px;
      min-height: 48px;
      padding: 12px 24px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="elementor elementor-100">
    <main class="elementor-element elementor-element-populate" data-id="sec-clean-hero" id="sec-clean-hero">
      <div class="elementor-element elementor-widget elementor-widget-heading" data-id="w-clean-heading">
        <div class="elementor-widget-container">
          <h1>Clean Responsive Page Example</h1>
        </div>
      </div>

      <div class="elementor-element elementor-widget elementor-widget-text-editor" data-id="w-clean-text">
        <div class="elementor-widget-container">
          <p>This page conforms to all responsive design checks with zero overflow, readable typography (>=16px), and accessible 48px touch targets.</p>
        </div>
      </div>

      <div class="elementor-element elementor-widget elementor-widget-button" data-id="w-clean-cta">
        <div class="elementor-widget-container">
          <button class="btn-clean" type="button">Get Started</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
